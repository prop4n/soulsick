[project]
name = "soulsick"
version = "0.1.0"
description = "Soulsick — client Soulseek self-hosté avec gestion de bibliothèque intégrée"
readme = "README.md"
authors = [
    { name = "prop4n", email = "legrandenzo.pro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aioslsk>=1.7.1",
    "aiosqlite>=0.22.1",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "mutagen>=1.48.1",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
soulsick = "soulsick:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
